services:
  db:
    image: postgres:15-alpine
    container_name: b2b_db
    env_file:
      - ./b2b_glasses/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: b2b_web

    command: gunicorn b2b_glasses.wsgi:application --bind 0.0.0.0:8000 --workers 4

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - db

  bot:
    build: .
    container_name: b2b_bot

    command: python bot.py

    volumes:
      - .:/app
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - web

  frontend:
    container_name: b2b_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend

    ports:
      - "3000:3000"
    depends_on:
      - web

  nginx:
    image: nginx:1.25-alpine
    container_name: b2b_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

      - static_volume:/app/staticfiles
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  static_volume:
