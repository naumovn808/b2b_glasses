services:
  db:
    image: postgres:15-alpine
    container_name: b2b_db
    restart: unless-stopped
    env_file:
      - ./b2b_glasses/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  web:
    build: .
    container_name: b2b_web
    restart: unless-stopped
    command: gunicorn b2b_glasses.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - db

  scheduler:
    build: .
    container_name: b2b_scheduler
    restart: unless-stopped
    command: python manage.py run_scheduler
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - db
      - web

  bot:
    build: .
    container_name: b2b_bot
    restart: unless-stopped
    command: python bot.py
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - web

  frontend:
    container_name: b2b_frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - '3000:3000'
    depends_on:
      - web

  nginx:
    image: nginx:1.25-alpine
    container_name: b2b_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ./b2b_glasses/media:/app/b2b_glasses/media:ro
      - media_volume:/app/media
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:
