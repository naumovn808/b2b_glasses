services:
  # 1. Сервис Базы Данных (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: b2b_db
    env_file:
      - ./b2b_glasses/.env 
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Сервис Django (Web API)
  web:
    build: . 
    container_name: b2b_web
    
    # --- ИСПРАВЛЕНИЕ 1: Gunicorn + Правильный путь ---
    # (Так как WORKDIR /app/b2b_glasses, 'b2b_glasses.wsgi' - правильный путь)
    command: gunicorn b2b_glasses.wsgi:application --bind 0.0.0.0:8000 --workers 4
    
    volumes:
      - .:/app
      - static_volume:/app/staticfiles # (Для Nginx)
    
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - db

  # 3. Сервис Бота
  bot:
    build: . 
    container_name: b2b_bot
    
    # --- ИСПРАВЛЕНИЕ 1: Правильный путь к bot.py ---
    # (Так как WORKDIR /app/b2b_glasses)
    command: python bot.py
    
    volumes:
      - .:/app
    env_file:
      - ./b2b_glasses/.env
    depends_on:
      - web

  # 4. FRONTEND
  frontend:
    container_name: b2b_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    volumes:
      # --- ИСПРАВЛЕНИЕ 2: Защищаем node_modules (Фикс Rollup) ---
      - ./frontend:/app/frontend
      - /app/frontend/node_modules 
    ports:
      - "3000:3000"
    depends_on:
      - web 
  
  # 5. NGINX
  nginx:
    image: nginx:1.25-alpine 
    container_name: b2b_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # --- (Nginx "смотрит" на статику, которую Gunicorn собрал в /app/staticfiles) ---
      - static_volume:/app/staticfiles 
    depends_on:
      - web
      - frontend

volumes:
  postgres_data:
  static_volume: # (Папка для CSS/JS админки)