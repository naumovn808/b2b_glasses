# 1. "Вверх по течению" (Upstreams)
upstream django_server {
    server web:8000;
}
upstream react_server {
    server frontend:3000;
}

# 2. Главный сервер (Привратник)
server {
    listen 80;
    
    # --- ИЗМЕНЕНИЕ: (Новое правило 1) ---
    # Обслуживаем СТАТИКУ (CSS/JS админки) НАПРЯМУЮ
    location /static/ {
        # Путь, который мы указали в STATIC_ROOT (в settings.py)
        # и в 'volumes' (в docker-compose.yml)
        alias /app/staticfiles/;
    }
    # ---

    # --- Правило 2: API и Админка ---
    location ~ ^/(api|admin)/ {
        proxy_pass http://django_server; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # --- Правило 3: React ---
    location / {
        proxy_pass http://react_server; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}